openapi: 3.1.0
info:
  title: SiapAI — AI Readiness Audit API
  version: 2.0.0
  description: |
    Kontrak API untuk aplikasi audit kesiapan AI bisnis (SiapAI).
    Sumber kebenaran tipe untuk frontend dan backend.

    STATUS IMPLEMENTASI
    Kontrak ini mendahului implementasi. Operasi yang belum tersedia di server
    ditandai `x-status: planned` dan akan mengembalikan 501 bila dipanggil.
    Yang bertanda `x-status: implemented` sudah berjalan dan teruji.
    Jalankan `python3 tools/traceability.py` untuk melihat peta terkini.

    Model v2 berbasis undangan:
    - Auditor login dan menerbitkan undangan assessment untuk perusahaan klien.
    - Sistem menghasilkan tautan bertoken dan QR code.
    - Owner perusahaan (responden) mengisi form tanpa akun, diautentikasi token
      undangan lewat path /f/{token}.
    - Tidak ada tier gratis, paywall, maupun pembayaran di dalam sistem.

    Autentikasi:
    - Endpoint auditor memerlukan Bearer token dan header `X-Company-Id` bila
      ber-scope perusahaan.
    - Endpoint responden memakai token undangan di path, tanpa Bearer.
  contact: { name: SiapAI Product, email: product@siapai.id }
  license: { name: Proprietary }
servers:
  - { url: 'https://api.siapai.id/v1', description: production }
  - { url: 'https://staging-api.siapai.id/v1', description: staging }
  - { url: 'http://localhost:3001/v1', description: local }

tags:
  - { name: Auth, description: Autentikasi auditor }
  - { name: Companies, description: Perusahaan klien yang diaudit }
  - { name: Invitations, description: Penerbitan undangan form dan QR code }
  - { name: Respondent, description: Pengisian form oleh owner memakai token undangan }
  - { name: Questionnaire }
  - { name: Results }
  - { name: Reports }
  - { name: Benchmark }
  - { name: Admin }

security:
  - bearerAuth: []

paths:
  # ───────────────────────── Auth ─────────────────────────
  /auth/register:
    x-status: planned
    post:
      tags: [Auth]
      summary: Daftar dengan email, kirim OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                name: { type: string, maxLength: 120 }
      responses:
        '202': { description: OTP terkirim, content: { application/json: { schema: { $ref: '#/components/schemas/OtpChallenge' } } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-otp:
    x-status: planned
    post:
      tags: [Auth]
      summary: Verifikasi OTP dan terbitkan token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: { type: string, format: uuid }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/google:
    x-status: planned
    post:
      tags: [Auth]
      summary: Login via Google OAuth2 id_token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id_token], properties: { id_token: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/refresh:
    x-status: planned
    post:
      tags: [Auth]
      summary: Rotasi refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/logout:
    x-status: planned
    post:
      tags: [Auth]
      summary: Cabut refresh token
      responses: { '204': { description: No Content } }

  /me:
    x-status: planned
    get:
      tags: [Auth]
      summary: Profil user dan keanggotaan organisasi
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  # ─────────────────────── Organizations ───────────────────────
  /companies:
    x-status: implemented
    get:
      tags: [Companies]
      summary: Daftar organisasi milik user
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Company' } } } }
    post:
      tags: [Companies]
      summary: Buat organisasi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompanyInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /companies/{companyId}:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/CompanyIdPath' }]
    get:
      tags: [Companies]
      summary: Detail organisasi
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      summary: Perbarui profil organisasi
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompanyInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Company' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /companies/{companyId}/members:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/CompanyIdPath' }]
    get:
      tags: [Companies]
      summary: Daftar anggota
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Member' } } } }
    post:
      tags: [Companies]
      summary: Undang anggota
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '201': { description: Undangan terkirim, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── Questionnaire ───────────────────────
  /questionnaires/active:
    x-status: planned
    get:
      tags: [Questionnaire]
      summary: Ambil kuesioner aktif (dimensi, pertanyaan, opsi, bobot)
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/AssessmentType' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Questionnaire' } } } }

  # ─────────────────────── Invitations (auditor) ───────────────────────
  /invitations:
    x-status: implemented
    get:
      tags: [Invitations]
      summary: Daftar undangan milik auditor beserta statusnya (FR-29)
      parameters:
        - { name: company_id, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invitation' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
    post:
      tags: [Invitations]
      summary: Terbitkan undangan form untuk owner perusahaan (FR-23)
      description: |
        Membuat token undangan sekaligus assessment `IN_PROGRESS` yang terikat
        padanya. Token mentah HANYA dikembalikan sekali pada respons ini;
        server menyimpan hash-nya saja.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_id]
              properties:
                company_id: { type: string, format: uuid }
                expires_in_days: { type: integer, enum: [7, 30, 90], default: 30 }
                recipient_name: { type: string, maxLength: 120 }
                recipient_email: { type: string, format: email }
      responses:
        '201':
          description: Undangan diterbitkan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationCreated' }
        '409':
          description: Masih ada undangan aktif untuk perusahaan ini (FR-23 AC4)
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  /invitations/{invitationId}:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationIdPath' }]
    get:
      tags: [Invitations]
      summary: Detail satu undangan
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Invitations]
      summary: Cabut undangan (FR-27)
      responses:
        '204': { description: Dicabut; token tidak dapat dipakai lagi }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{invitationId}/reissue:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationIdPath' }]
    post:
      tags: [Invitations]
      summary: Terbitkan ulang token & QR, jawaban dipertahankan (FR-27 AC2)
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationCreated' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{invitationId}/qr.png:
    x-status: implemented
    parameters:
      - { $ref: '#/components/parameters/InvitationIdPath' }
      - name: size
        in: query
        description: Sisi QR dalam piksel; minimal 256 (FR-24 AC2)
        schema: { type: integer, minimum: 256, maximum: 2048, default: 512 }
      - name: print_label
        in: query
        description: Sertakan nama perusahaan di bawah QR untuk versi cetak (FR-24 AC3)
        schema: { type: boolean, default: false }
    get:
      tags: [Invitations]
      summary: QR code undangan dalam PNG (FR-24)
      responses:
        '200':
          description: Gambar QR
          content:
            image/png:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /invitations/{invitationId}/qr.svg:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationIdPath' }]
    get:
      tags: [Invitations]
      summary: QR code undangan dalam SVG (FR-24)
      responses:
        '200':
          description: Gambar QR vektor
          content:
            image/svg+xml:
              schema: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────── Respondent (token undangan, tanpa akun) ───────────────────
  /f/{token}:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    get:
      tags: [Respondent]
      summary: Halaman sambutan form undangan (FR-25)
      description: |
        Dipanggil setelah owner mengeklik tautan atau memindai QR.
        Pembukaan pertama mengubah status SENT menjadi OPENED.
        Token tidak valid, dicabut, atau kedaluwarsa mengembalikan 404 netral.
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FormWelcome' } } } }
        '404': { $ref: '#/components/responses/InvitationInvalid' }

  /f/{token}/next:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    get:
      tags: [Respondent]
      summary: Ambil seksi pertanyaan berikutnya beserta progres (FR-08)
      security: []
      parameters:
        - { name: section, in: query, schema: { type: string, examples: [DAT] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SectionPayload' } } } }
        '404': { $ref: '#/components/responses/InvitationInvalid' }

  /f/{token}/answers:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    patch:
      tags: [Respondent]
      summary: Simpan batch jawaban (autosave, idempoten per question_code) (FR-09)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                client_revision: { type: integer, minimum: 0 }
                answers:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items: { $ref: '#/components/schemas/AnswerInput' }
            examples:
              batch:
                value:
                  client_revision: 12
                  answers:
                    - { question_code: DAT-01, value: { choice: opt_75 } }
                    - { question_code: DAT-07, value: { choices: [sales_tx, customer] } }
                    - { question_code: STR-06, value: { scale: 4 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SaveResult' } } } }
        '404': { $ref: '#/components/responses/InvitationInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /f/{token}/review:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    get:
      tags: [Respondent]
      summary: Ringkasan jawaban dan daftar pertanyaan yang masih kosong (FR-11)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  progress: { $ref: '#/components/schemas/Progress' }
                  missing: { type: array, items: { type: string } }
                  answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
        '404': { $ref: '#/components/responses/InvitationInvalid' }

  /f/{token}/submit:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    post:
      tags: [Respondent]
      summary: Kirim jawaban dan jalankan skoring (FR-12)
      security: []
      responses:
        '200': { description: Selesai diskor, content: { application/json: { schema: { $ref: '#/components/schemas/ScoreResult' } } } }
        '404': { $ref: '#/components/responses/InvitationInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Masih ada pertanyaan wajib yang belum dijawab
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                incomplete:
                  value:
                    error:
                      code: INCOMPLETE
                      message: Masih ada 2 pertanyaan wajib yang belum dijawab
                      details: { missing: [DAT-03, GOV-02] }
                      trace_id: 0f1c2d3e

  /f/{token}/result:
    x-status: implemented
    parameters: [{ $ref: '#/components/parameters/InvitationTokenPath' }]
    get:
      tags: [Respondent]
      summary: Hasil audit untuk responden, terbuka penuh tanpa paywall (FR-16, FR-30)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: '#/components/schemas/ScoreResult' }
                  recommendations: { $ref: '#/components/schemas/RecommendationBundle' }
        '404': { $ref: '#/components/responses/InvitationInvalid' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ─────────────────────── Assessments (auditor) ───────────────────────
  /assessments:
    x-status: planned
    get:
      tags: [Results]
      summary: Daftar assessment perusahaan
      parameters:
        - { $ref: '#/components/parameters/CompanyIdHeader' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssessmentStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentPage' } } } }

  /assessments/{assessmentId}:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/AssessmentIdPath' }, { $ref: '#/components/parameters/CompanyIdHeader' }]
    get:
      tags: [Results]
      summary: Detail assessment beserta jawaban tersimpan
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Results ─────────────────────────
  /assessments/{assessmentId}/result:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/AssessmentIdPath' }, { $ref: '#/components/parameters/CompanyIdHeader' }]
    get:
      tags: [Results]
      summary: Hasil skoring lengkap
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ScoreResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /assessments/{assessmentId}/recommendations:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/AssessmentIdPath' }, { $ref: '#/components/parameters/CompanyIdHeader' }]
    get:
      tags: [Results]
      summary: Rekomendasi berprioritas dan roadmap
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/RecommendationBundle' } } }

  /companies/{companyId}/trend:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/CompanyIdPath' }]
    get:
      tags: [Results]
      summary: Tren skor antar assessment
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TrendPoint' } } } }

  # ───────────────────────── Reports ─────────────────────────
  /assessments/{assessmentId}/report/pdf:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/AssessmentIdPath' }, { $ref: '#/components/parameters/CompanyIdHeader' }]
    post:
      tags: [Reports]
      summary: Minta pembuatan PDF (asinkron)
      responses:
        '202': { description: Antrean dibuat, content: { application/json: { schema: { $ref: '#/components/schemas/ReportJob' } } } }

  /reports/jobs/{jobId}:
    x-status: planned
    parameters: [{ name: jobId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Reports]
      summary: Status job PDF
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReportJob' } } } }

  /assessments/{assessmentId}/share-links:
    x-status: planned
    parameters: [{ $ref: '#/components/parameters/AssessmentIdPath' }, { $ref: '#/components/parameters/CompanyIdHeader' }]
    post:
      tags: [Reports]
      summary: Buat tautan berbagi read-only
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_days: { type: integer, enum: [7, 30, 90], default: 30 }
                anonymize: { type: boolean, default: false }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ShareLink' } } } }

  /share-links/{token}:
    x-status: planned
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    delete:
      tags: [Reports]
      summary: Cabut tautan berbagi
      responses: { '204': { description: No Content } }

  # ─────────────────────── Benchmark ───────────────────────
  /benchmark:
    x-status: planned
    get:
      tags: [Benchmark]
      summary: Statistik pembanding industri
      parameters:
        - { name: industry, in: query, required: true, schema: { $ref: '#/components/schemas/Industry' } }
        - { name: employee_band, in: query, schema: { $ref: '#/components/schemas/EmployeeBand' } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Benchmark' } } } }

  # ───────────────────────── Admin ─────────────────────────
  /admin/questionnaires:
    x-status: planned
    get:
      tags: [Admin]
      summary: Daftar versi kuesioner
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/QuestionnaireVersion' } } } }
    post:
      tags: [Admin]
      summary: Buat versi DRAFT baru (salin dari versi lain)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { clone_from: { type: string } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionnaireVersion' } } } }

  /admin/questionnaires/{versionId}/publish:
    x-status: planned
    parameters: [{ name: versionId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Admin]
      summary: Terbitkan versi (menjadi immutable)
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionnaireVersion' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/questions:
    x-status: planned
    post:
      tags: [Admin]
      summary: Tambah pertanyaan ke versi DRAFT
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuestionInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }

  /admin/questions/{questionId}:
    x-status: planned
    parameters: [{ name: questionId, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [Admin]
      summary: Ubah pertanyaan pada versi DRAFT
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuestionInput' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Admin]
      summary: Hapus pertanyaan pada versi DRAFT
      responses: { '204': { description: No Content } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    CompanyIdHeader:
      name: X-Company-Id
      in: header
      required: true
      description: Organisasi aktif untuk permintaan ini
      schema: { type: string, format: uuid }
    CompanyIdPath:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssessmentIdPath:
      name: assessmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationIdPath:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationTokenPath:
      name: token
      in: path
      required: true
      description: Token undangan dari tautan atau hasil pindai QR
      schema: { type: string, minLength: 32 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Unauthenticated:
      description: Tidak terautentikasi
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Forbidden:
      description: Tidak berwenang
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Tidak ditemukan
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Conflict:
      description: Konflik status
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    UnprocessableEntity:
      description: Validasi gagal
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    RateLimited:
      description: Terlalu banyak permintaan
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    InvitationInvalid:
      description: |
        Token undangan tidak dikenal, sudah dicabut, atau kedaluwarsa.
        Pesan sengaja netral agar tidak membocorkan keberadaan token (FR-25 AC3).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, INCOMPLETE,
                     INVALID_ANSWER_TYPE, QUESTION_NOT_VISIBLE, INVITATION_INVALID,
                     RATE_LIMITED, INTERNAL]
            message: { type: string }
            details: { type: object, additionalProperties: true }
            trace_id: { type: string }

    OtpChallenge:
      type: object
      properties:
        challenge_id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }

    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: detik, examples: [900] }

    Role:
      type: string
      enum: [owner, admin, member, viewer]

    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        memberships:
          type: array
          items:
            type: object
            properties:
              organization: { $ref: '#/components/schemas/Company' }
              role: { $ref: '#/components/schemas/Role' }

    Industry:
      type: string
      enum: [manufacturing, retail_ecommerce, fnb, logistics, financial_services,
             healthcare, education, professional_services, construction_property,
             agriculture, media_creative, technology, government_public, other]

    EmployeeBand:
      type: string
      enum: ['1_9', '10_49', '50_99', '100_499', '500_999', '1000_plus']

    RevenueBand:
      type: string
      enum: [under_2_5b, 2_5b_15b, 15b_50b, 50b_250b, 250b_plus, undisclosed]

    CompanyInput:
      type: object
      required: [name, industry, employee_band]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        industry: { $ref: '#/components/schemas/Industry' }
        employee_band: { $ref: '#/components/schemas/EmployeeBand' }
        revenue_band: { $ref: '#/components/schemas/RevenueBand' }
        country: { type: string, default: ID }
        province: { type: string }

    Company:
      allOf:
        - $ref: '#/components/schemas/CompanyInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            created_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [invited, active, suspended] }

    QuestionType:
      type: string
      enum: [single_choice, multi_choice, scale_1_5, boolean, number, text]

    DimensionCode:
      type: string
      enum: [STR, DAT, TEC, PPL, PRC, GOV, FIN]

    QuestionOption:
      type: object
      required: [code, label, score]
      properties:
        code: { type: string, examples: [opt_75] }
        label: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        order: { type: integer }

    VisibilityRule:
      type: object
      description: DSL murni; operator eq, neq, in, nin, gt, gte, lt, lte, exists
      additionalProperties: true
      examples:
        - all:
            - { question: ORG-02, op: in, value: ['100_499', '500_999', '1000_plus'] }

    Question:
      type: object
      required: [id, code, dimension_code, type, prompt, weight, required]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [DAT-01] }
        dimension_code: { $ref: '#/components/schemas/DimensionCode' }
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string }
        help_text: { type: string }
        weight: { type: number, minimum: 0 }
        required: { type: boolean }
        order: { type: integer }
        in_quick_check: { type: boolean }
        min_select: { type: integer }
        max_select: { type: integer }
        min: { type: number }
        max: { type: number }
        options: { type: array, items: { $ref: '#/components/schemas/QuestionOption' } }
        visibility_rule: { $ref: '#/components/schemas/VisibilityRule' }

    QuestionInput:
      allOf:
        - $ref: '#/components/schemas/Question'
        - type: object
          required: [questionnaire_version_id]
          properties:
            questionnaire_version_id: { type: string }

    Dimension:
      type: object
      properties:
        code: { $ref: '#/components/schemas/DimensionCode' }
        name: { type: string }
        description: { type: string }
        weight: { type: number, minimum: 0, maximum: 1 }

    Questionnaire:
      type: object
      properties:
        version: { type: string, examples: ['1.0.0'] }
        rubric_version: { type: string, examples: ['1.0.0'] }
        dimensions: { type: array, items: { $ref: '#/components/schemas/Dimension' } }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }

    QuestionnaireVersion:
      type: object
      properties:
        id: { type: string }
        version: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
        published_at: { type: string, format: date-time }

    InvitationStatus:
      type: string
      enum: [SENT, OPENED, IN_PROGRESS, SUBMITTED, SCORED, REVOKED, EXPIRED]
      description: |
        Transisi sah: SENT -> OPENED -> IN_PROGRESS -> SUBMITTED -> SCORED.
        REVOKED dan EXPIRED adalah status terminal yang dapat dicapai dari
        status mana pun sebelum SUBMITTED (FR-29 AC2).

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        company_name: { type: string }
        assessment_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        recipient_name: { type: string }
        recipient_email: { type: string, format: email }
        progress: { $ref: '#/components/schemas/Progress' }
        issued_at: { type: string, format: date-time }
        opened_at: { type: string, format: date-time, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }
        reminder_count: { type: integer }

    InvitationCreated:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          description: |
            `token` dan `invitation_url` hanya dikembalikan sekali, saat
            penerbitan atau penerbitan ulang. Server menyimpan hash token
            saja, sehingga nilai ini tidak dapat diambil kembali (FR-23 AC1).
          properties:
            token: { type: string }
            invitation_url:
              type: string
              format: uri
              examples: ['https://siapai.id/f/8f3a...c21']
            qr_png_url:
              type: string
              format: uri
              description: Endpoint QR siap unduh atau cetak
            qr_svg_url: { type: string, format: uri }

    FormWelcome:
      type: object
      description: Halaman sambutan yang dilihat owner setelah memindai QR (FR-25 AC1)
      properties:
        company_name: { type: string }
        invited_by: { type: string, description: Nama auditor pengundang }
        total_questions: { type: integer }
        estimated_minutes: { type: integer, examples: [22] }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        progress: { $ref: '#/components/schemas/Progress' }
        expires_at: { type: string, format: date-time }
        resume: { type: boolean, description: true bila sudah ada jawaban tersimpan }

    AssessmentType:
      type: string
      enum: [FULL]
      description: |
        v2 hanya memiliki satu jenis audit penuh. Tier QUICK gratis dihapus
        bersama model self-serve.
    AssessmentStatus: { type: string, enum: [IN_PROGRESS, SUBMITTED, SCORED, ARCHIVED] }

    Assessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/AssessmentType' }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        questionnaire_version: { type: string }
        rubric_version: { type: string }
        started_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }
        progress: { $ref: '#/components/schemas/Progress' }

    AssessmentDetail:
      allOf:
        - $ref: '#/components/schemas/Assessment'
        - type: object
          properties:
            server_revision: { type: integer }
            answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }

    AssessmentPage:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Assessment' } }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    Progress:
      type: object
      properties:
        answered: { type: integer }
        total_visible: { type: integer }
        percent: { type: number, minimum: 0, maximum: 100 }
        estimated_minutes_left: { type: integer }

    AnswerValue:
      description: Bentuk nilai mengikuti tipe pertanyaan
      oneOf:
        - { type: object, required: [choice], properties: { choice: { type: string } } }
        - { type: object, required: [choices], properties: { choices: { type: array, items: { type: string } } } }
        - { type: object, required: [scale], properties: { scale: { type: integer, minimum: 1, maximum: 5 } } }
        - { type: object, required: [bool], properties: { bool: { type: boolean } } }
        - { type: object, required: [number], properties: { number: { type: number } } }
        - { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 } } }

    AnswerInput:
      type: object
      required: [question_code, value]
      properties:
        question_code: { type: string }
        value: { $ref: '#/components/schemas/AnswerValue' }
        evidence_url: { type: string, format: uri }

    Answer:
      allOf:
        - $ref: '#/components/schemas/AnswerInput'
        - type: object
          properties:
            answered_at: { type: string, format: date-time }

    SaveResult:
      type: object
      properties:
        saved: { type: integer }
        server_revision: { type: integer }
        progress: { $ref: '#/components/schemas/Progress' }
        newly_visible: { type: array, items: { type: string }, description: question_code yang baru muncul akibat branching }
        newly_hidden: { type: array, items: { type: string } }

    SectionPayload:
      type: object
      properties:
        dimension: { $ref: '#/components/schemas/Dimension' }
        section_index: { type: integer }
        section_total: { type: integer }
        questions: { type: array, items: { $ref: '#/components/schemas/Question' } }
        answers: { type: array, items: { $ref: '#/components/schemas/Answer' } }
        progress: { $ref: '#/components/schemas/Progress' }

    MaturityLevel: { type: integer, minimum: 1, maximum: 5 }
    Verdict: { type: string, enum: [READY, CONDITIONALLY_READY, NOT_READY] }

    DimensionScore:
      type: object
      properties:
        dimension_code: { $ref: '#/components/schemas/DimensionCode' }
        name: { type: string }
        score: { type: number, minimum: 0, maximum: 100 }
        level: { $ref: '#/components/schemas/MaturityLevel' }
        weight: { type: number }
        benchmark_percentile: { type: number, nullable: true }

    Gate:
      type: object
      properties:
        code: { type: string, enum: [DATA_FOUNDATION_GATE, GOVERNANCE_GATE] }
        triggered: { type: boolean }
        message: { type: string }

    ScoreResult:
      type: object
      required: [assessment_id, total_score, level, verdict, dimensions]
      properties:
        assessment_id: { type: string, format: uuid }
        total_score: { type: number, minimum: 0, maximum: 100, examples: [58.4] }
        level: { $ref: '#/components/schemas/MaturityLevel' }
        verdict: { $ref: '#/components/schemas/Verdict' }
        confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
        gates: { type: array, items: { $ref: '#/components/schemas/Gate' } }
        dimensions: { type: array, items: { $ref: '#/components/schemas/DimensionScore' } }
        benchmark_available: { type: boolean }
        rubric_version: { type: string }
        computed_at: { type: string, format: date-time }
        summary: { type: string, description: Ringkasan naratif 2-3 kalimat }

    Recommendation:
      type: object
      properties:
        code: { type: string, examples: [REC-DAT-002] }
        title: { type: string }
        body: { type: string }
        dimension_code: { $ref: '#/components/schemas/DimensionCode' }
        impact: { type: integer, minimum: 1, maximum: 5 }
        effort: { type: integer, minimum: 1, maximum: 5 }
        priority_score: { type: number }
        horizon: { type: string, enum: ['0_3M', '3_6M', '6_12M'] }
        owner_role: { type: string, examples: [Head of IT] }
        cost_band: { type: string, enum: [under_10jt, 10_30jt, 30_100jt, 100_500jt, above_500jt] }

    RecommendationBundle:
      type: object
      properties:
        items: { type: array, minItems: 3, items: { $ref: '#/components/schemas/Recommendation' } }
        roadmap:
          type: object
          properties:
            '0_3M': { type: array, items: { type: string } }
            '3_6M': { type: array, items: { type: string } }
            '6_12M': { type: array, items: { type: string } }

    TrendPoint:
      type: object
      properties:
        assessment_id: { type: string, format: uuid }
        submitted_at: { type: string, format: date-time }
        total_score: { type: number }
        dimensions:
          type: object
          additionalProperties: { type: number }

    Benchmark:
      type: object
      properties:
        industry: { $ref: '#/components/schemas/Industry' }
        employee_band:
          oneOf: [{ $ref: '#/components/schemas/EmployeeBand' }, { type: 'null' }]
        sample_size: { type: integer }
        available: { type: boolean, description: false bila sample_size < 30 }
        total: { type: object, properties: { p25: { type: number }, p50: { type: number }, p75: { type: number } } }
        dimensions:
          type: array
          items:
            type: object
            properties:
              dimension_code: { $ref: '#/components/schemas/DimensionCode' }
              p25: { type: number }
              p50: { type: number }
              p75: { type: number }

      type: object
      properties:
        total_score: { type: number }
        level: { $ref: '#/components/schemas/MaturityLevel' }
        verdict: { $ref: '#/components/schemas/Verdict' }
        confidence: { type: string, enum: [LOW] }
        teaser: { type: string, description: Satu kalimat temuan utama }
        upgrade_cta: { type: string }

    ReportJob:
      type: object
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROCESSING, DONE, FAILED] }
        download_url: { type: string, format: uri, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    ShareLink:
      type: object
      properties:
        token: { type: string }
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
        anonymize: { type: boolean }

    SharedReport:
      type: object
      properties:
        organization_name: { type: string, nullable: true, description: null bila anonymize }
        result: { $ref: '#/components/schemas/ScoreResult' }
        recommendations: { $ref: '#/components/schemas/RecommendationBundle' }

      type: object
      properties:
        company_id: { type: string, format: uuid }
        plan: { type: string, enum: [FREE, PRO_SINGLE, TEAM_ANNUAL, PARTNER] }
        status: { type: string, enum: [ACTIVE, EXPIRED, PENDING] }
        valid_until: { type: string, format: date-time, nullable: true }
